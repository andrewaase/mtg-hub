[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sync store listing prices with Scryfall market data every day at 8am UTC
[functions."update-prices"]
  schedule = "0 8 * * *"

# Snapshot MTGGoldfish + MTGTop8 data for spike predictor every Sunday at 6am UTC
[functions."ingest-meta"]
  schedule = "0 6 * * 0"

# Fetch all paper card prices, snapshot daily, compute 7-day market movers at 9am UTC
# Uses -background suffix so HTTP POST calls also get the 15-minute timeout
[functions."compute-market-movers-background"]
  schedule = "0 9 * * *"

# Reconcile store inventory against ManaPool (primary sales channel) every 30 min
# so cards sold on ManaPool drop out of Mana Mint automatically
[functions."manapool-sync"]
  schedule = "*/30 * * * *"

# Recompute sealed-product EV (MTGJSON pack odds × live prices) weekly, Mon 10am UTC
[functions."compute-sealed-ev-background"]
  schedule = "0 10 * * 1"

[[redirects]]
  from = "https://vaultedsingles.com/*"
  to = "https://www.manamint.store/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vaultedsingles.com/*"
  to = "https://www.manamint.store/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent the site from being embedded in iframes on other domains (clickjacking)
    X-Frame-Options = "DENY"

    # Stop browsers from MIME-sniffing responses away from the declared content-type
    X-Content-Type-Options = "nosniff"

    # Only send the origin (no path/query) in the Referer header on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict which browser features this site can use.
    # camera=(self) is required for the card-scan modal.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(self)"

    # Content Security Policy — explicitly allow every external resource the app uses:
    #   script-src  : our own bundle + Stripe.js + Google Analytics (gtag)
    #   style-src   : our own styles + 'unsafe-inline' (required for React inline styles)
    #   img-src     : our own assets, base64 data URIs, and any HTTPS image (card art, thumbnails)
    #   connect-src : Supabase REST + realtime WS, Scryfall API, Stripe API, Card Kingdom API, Google Analytics
    #   frame-src   : Stripe payment iframe
    #   object-src  : blocked entirely (no Flash / plugins)
    #   base-uri    : locked to self (prevents base-tag injection attacks)
    #   form-action : locked to self (prevents form hijacking)
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com 'sha256-5Bugu6vxtWT3nqT9DBwz+gGoLSkgo90zx0760R4kPCY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.scryfall.com https://svgs.scryfall.io https://api.stripe.com https://js.stripe.com https://api.cardkingdom.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"
